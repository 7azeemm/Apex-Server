[package]
name = "backend-server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.46.1", features = ["full"] }
reqwest = { version = "0.12.22", features = ["json", "gzip", "brotli"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
once_cell = "1.21.3"
sea-orm = { version = "1.1.13", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
rustc-hash = "2.1.1"
tokio-stream = "0.1.17"
futures-util = "0.3.31"
fastnbt = "2.5.0"
base64 = "0.22.1"
flate2 = "1.1.2"
async-trait = "0.1.88"
phf = { version = "0.12.1", features = ["macros"] }
axum = "0.8.4"
tracing = "0.1.41"
chrono = "0.4.41"
git2 = "0.20.2"
fuzzy-matcher = "0.3.7"
strsim = "0.11.1"