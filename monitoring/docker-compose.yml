services:
  # Grafana - Visualization Dashboard
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3000:3000"  # Access Grafana at localhost:3000
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana  # Persist Grafana data (dashboards, users, etc.)
      - ./grafana/provisioning:/etc/grafana/provisioning  # Auto-configure data sources
    networks:
      - monitoring
    restart: unless-stopped

  # Prometheus - Metrics Collection & Storage
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"  # Access Prometheus UI at localhost:9090
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'  # Allow reloading config via API
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml  # Prometheus config
      - prometheus-data:/prometheus  # Persist metrics data
    networks:
      - monitoring
    restart: unless-stopped

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"  # Loki API endpoint
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml  # Loki config
      - loki-data:/loki  # Persist log data
    networks:
      - monitoring
    restart: unless-stopped

  # Promtail - Log Shipper (sends logs to Loki)
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml  # Promtail config
      # Mount your app's logs directory (one level up from monitoring/)
      - ../logs:/logs:ro  # This points to your project's logs folder
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring
    restart: unless-stopped

# Networks - All services communicate on this network
networks:
  monitoring:
    driver: bridge

# Volumes - Persistent storage so data survives container restarts
volumes:
  grafana-data:
  prometheus-data:
  loki-data: